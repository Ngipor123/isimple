name: Deploy Astro Website to DirectAdmin FTP

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [sanity-deploy]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
        env:
          SANITY_PROJECT_ID: 'w4o960ve'
          SANITY_DATASET: 'production'

      - name: Deploy to FTP Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: /domains/isimple.unri.lv/public_html/
          port: 21
          protocol: ftp
          dangerous-clean-slate: false
